<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>rronblocks — Generative Op-Art Studio</title>
  <style>
    :root {
      --bg-dark: #090b0e;
      --panel-bg: #13161e;
      --card-bg: #1c202a;
      --card-border: #282d3b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      padding: 8px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 12px;
      height: 12px;
      background: #0066ff;
      border-radius: 2px;
      display: inline-block;
    }

    header h1 {
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      font-weight: 800;
      color: #fff;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 7px 12px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: #252a37;
      border-color: #3b4252;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.small {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .mobile-tab-switch {
      display: none;
      background: #0e1017;
      border-radius: 6px;
      padding: 3px;
      border: 1px solid var(--card-border);
    }

    .mobile-tab-switch button {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .mobile-tab-switch button.active {
      background: var(--accent);
      color: #fff;
    }

    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060709;
      position: relative;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    .viewport-scroll-area {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 100%;
      min-height: 100%;
      padding: 20px;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 16px 40px rgba(0,0,0,0.9);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
      transition: width 0.15s ease, height 0.15s ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewport-floating-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(19, 22, 30, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 15;
    }

    .viewport-floating-bar label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .viewport-floating-bar input[type="range"] {
      width: 85px;
      accent-color: var(--accent);
    }

    .controls-panel {
      width: 400px;
      background: var(--panel-bg);
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
      height: 100%;
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .row label {
      font-size: 0.8rem;
      color: var(--text-muted);
      flex: 1;
    }

    .row input[type="range"] {
      flex: 1.5;
      accent-color: var(--accent);
    }

    .row select, .row input[type="number"] {
      background: #11141b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 7px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .row input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
    .row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .row input[type="color"]::-webkit-color-swatch { border: 1px solid var(--card-border); border-radius: 4px; }

    .btn-group-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .layer-card {
      background: #151821;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      transition: border-color 0.15s ease;
    }

    .layer-card.active {
      border-color: var(--accent);
      background: #181c27;
    }

    .layer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .layer-title {
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .layer-actions {
      display: flex;
      gap: 4px;
    }

    .layer-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 860px) {
      .mobile-tab-switch {
        display: flex;
      }

      .app-container {
        flex-direction: column;
      }

      body[data-mobile-view="canvas"] .viewport {
        display: flex;
        flex: 1;
        height: 100%;
        max-height: none;
        padding-bottom: 60px;
      }

      body[data-mobile-view="canvas"] .controls-panel {
        display: none;
      }

      body[data-mobile-view="editor"] .viewport {
        flex: 0 0 36vh;
        border-bottom: 1px solid var(--card-border);
        padding: 8px;
      }

      body[data-mobile-view="editor"] .controls-panel {
        display: flex;
        flex: 1;
        width: 100%;
        border-left: none;
      }

      .viewport-floating-bar {
        bottom: 10px;
        padding: 4px 10px;
      }
    }
  </style>
</head>
<body data-mobile-view="editor">

  <header>
    <div class="brand">
      <span class="brand-badge"></span>
      <h1>rronblocks</h1>
    </div>

    <div class="mobile-tab-switch">
      <button id="btnViewEditor" class="active" onclick="setMobileView('editor')">Edit</button>
      <button id="btnViewCanvas" onclick="setMobileView('canvas')">Canvas</button>
    </div>

    <div class="top-actions">
      <button onclick="randomizeArtwork('balanced')">🎲 Random</button>
      <button class="primary" onclick="exportPNG()">Export</button>
    </div>
  </header>

  <div class="app-container">
    <div class="viewport" id="viewport">
      <div class="viewport-scroll-area">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="artCanvas"></canvas>
        </div>
      </div>

      <div class="viewport-floating-bar">
        <label>Zoom</label>
        <input type="range" id="zoomRange" min="50" max="220" value="100" oninput="updateCanvasScale(this.value)" />
        <button class="small" onclick="fitCanvasToScreen()">Fit</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="panel-scroll">

        <!-- Randomization Generator Variations -->
        <div class="section">
          <div class="section-title">Generative Archetypes</div>
          <div class="row">
            <label>Archetype</label>
            <select id="randomStyleSelect">
              <option value="balanced">Balanced Construct (Classic)</option>
              <option value="gradients_only">Atmospheric Gradients Only</option>
              <option value="dense">Dense Op-Art Grids</option>
              <option value="atmospheric">Atmosphere & Chevrons</option>
              <option value="wedges">Wedge Horizon (Saw Waves)</option>
              <option value="interference">Pinstripe Interference</option>
              <option value="mondrian">Mondrian / Bauhaus Planes</option>
              <option value="chaos">Radical Geometry</option>
            </select>
          </div>
          <button class="primary" style="width: 100%; margin-top: 4px;" onclick="randomizeBySelectedArchetype()">
            ✨ Generate New Variation
          </button>
          <div class="btn-group-grid">
            <button onclick="mutateColorsOnly()">🎨 Shuffle Colors</button>
            <button onclick="mutateGeometryOnly()">📐 Mutate Layout</button>
          </div>
        </div>

        <!-- Canvas Setup & Color Theme -->
        <div class="section">
          <div class="section-title">Canvas & Texture</div>
          <div class="row">
            <label>Aspect Ratio</label>
            <select id="aspectRatio" onchange="updateCanvasRatio()">
              <option value="9:16">9:16 (Phone Screen)</option>
              <option value="1:1">1:1 (Square)</option>
              <option value="4:5">4:5 (Print / Portrait)</option>
              <option value="16:9">16:9 (Landscape)</option>
            </select>
          </div>
          <div class="row">
            <label>Palette Presets</label>
            <select id="paletteSelect" onchange="applyPalette(this.value)">
              <option value="electric">Electric Blue & Rust</option>
              <option value="klein">Klein Blue & Ochre</option>
              <option value="bauhaus">Bauhaus Classic</option>
              <option value="swiss">Swiss International</option>
              <option value="terracotta">Terracotta & Sage</option>
              <option value="monochrome">Brutalist Sand & Charcoal</option>
              <option value="cyber">Tokyo Cyberpunk</option>
              <option value="acid">Acid Construct</option>
              <option value="ultramarine">Pure Ultramarine</option>
              <option value="sepia">Warm Sepia Screenprint</option>
            </select>
          </div>
          <div class="row">
            <label>Riso / Film Grain</label>
            <input type="range" id="grainAmount" min="0" max="50" value="26" oninput="render()" />
          </div>
        </div>

        <!-- Layer Blocks List -->
        <div class="section">
          <div class="section-title">
            <span>Blocks / Elements</span>
            <button class="small primary" onclick="addNewLayer()">+ Add Block</button>
          </div>
          <div id="layersList"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const PALETTES = {
      electric: ['#0077ff', '#ff4d00', '#0a0d14', '#e6e4df', '#101e36', '#6f7480'],
      klein: ['#002fa7', '#e8a938', '#0b0c10', '#f4ede2', '#1a3b8b', '#7c8b9e'],
      bauhaus: ['#d62828', '#003049', '#fdf0d5', '#f77f00', '#111111', '#eae2b7'],
      swiss: ['#e63946', '#1d3557', '#f1faee', '#457b9d', '#111827', '#a8dadc'],
      terracotta: ['#c85a32', '#3d5a45', '#f3eae1', '#1f2421', '#8c9a8e', '#d4a373'],
      monochrome: ['#121212', '#f4f1ea', '#888888', '#2b2b2b', '#d3cfc7', '#444444'],
      cyber: ['#ff0055', '#00f0ff', '#2d006b', '#0d0221', '#fffa65', '#ffffff'],
      acid: ['#b4f000', '#5e17eb', '#0d0c1d', '#e0e2db', '#23004b', '#9b5de5'],
      ultramarine: ['#0011ff', '#000000', '#ffffff', '#264bff', '#8ca1ff', '#050a24'],
      sepia: ['#3e2723', '#d7ccc8', '#ff7043', '#271b16', '#a1887f', '#fff3e0']
    };

    let layers = [];
    let activeLayerId = null;
    let currentZoomMultiplier = 1.0;

    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');
    const wrapper = document.getElementById('canvasWrapper');

    let baseWidth = 1080;
    let baseHeight = 1920;

    function initLayers() {
      layers = [
        { id: 'bg', type: 'solid', x: 0, y: 0, w: 100, h: 100, color1: '#0a0d14' },
        { id: 'grad-top', type: 'gradient', x: 0, y: 0, w: 100, h: 14, color1: '#0088ff', color2: '#05070a', angle: 90 },
        { id: 'pinstripe-mid-left', type: 'stripes', x: 0, y: 14, w: 38, h: 44, color1: '#757c88', color2: '#ff4d00', frequency: 5, thickness: 1.5, stripeAngle: 90 },
        { id: 'solid-blue-bar', type: 'gradient', x: 16, y: 14, w: 22, h: 44, color1: '#0055ff', color2: '#0038aa', angle: 0 },
        { id: 'pinstripe-top-right', type: 'stripes', x: 38, y: 14, w: 62, h: 21, color1: '#ff4400', color2: '#0033aa', frequency: 5, thickness: 1.8, stripeAngle: 90 },
        { id: 'pinstripe-mid-right', type: 'stripes', x: 38, y: 35, w: 62, h: 23, color1: '#7e838f', color2: '#ff5500', frequency: 4, thickness: 1.5, stripeAngle: 0 },
        { id: 'spikes-band-mid', type: 'spikes', x: 0, y: 58, w: 100, h: 14, color1: '#0a0c10', color2: '#dedad1', frequency: 3, spikeDirection: 'right' },
        { id: 'bottom-spikes', type: 'spikes', x: 0, y: 72, w: 25, h: 28, color1: '#e1ded7', color2: '#00a2ff', frequency: 4, spikeDirection: 'left' },
        { id: 'bottom-dense-blue', type: 'stripes', x: 25, y: 72, w: 55, h: 28, color1: '#001a66', color2: '#0066ff', frequency: 4, thickness: 1.6, stripeAngle: 0 },
        { id: 'bottom-fine-right', type: 'stripes', x: 80, y: 72, w: 20, h: 28, color1: '#e0f2fe', color2: '#0284c7', frequency: 4, thickness: 1.5, stripeAngle: 90 }
      ];
      activeLayerId = layers[1].id;
    }

    function setMobileView(view) {
      document.body.setAttribute('data-mobile-view', view);
      document.getElementById('btnViewEditor').classList.toggle('active', view === 'editor');
      document.getElementById('btnViewCanvas').classList.toggle('active', view === 'canvas');
      setTimeout(resizeViewportCanvas, 50);
    }

    function updateCanvasScale(percent) {
      currentZoomMultiplier = percent / 100;
      resizeViewportCanvas();
    }

    function fitCanvasToScreen() {
      document.getElementById('zoomRange').value = 100;
      currentZoomMultiplier = 1.0;
      resizeViewportCanvas();
    }

    function resizeViewportCanvas() {
      const pad = 24;
      const availW = Math.max(100, viewport.clientWidth - pad);
      const availH = Math.max(100, viewport.clientHeight - pad);
      const aspect = baseWidth / baseHeight;

      let w = availW;
      let h = w / aspect;

      if (h > availH) {
        h = availH;
        w = h * aspect;
      }

      w = w * currentZoomMultiplier;
      h = h * currentZoomMultiplier;

      wrapper.style.width = `${Math.floor(w)}px`;
      wrapper.style.height = `${Math.floor(h)}px`;
    }

    function updateCanvasRatio() {
      const val = document.getElementById('aspectRatio').value;
      if (val === '9:16') { baseWidth = 1080; baseHeight = 1920; }
      else if (val === '1:1') { baseWidth = 1200; baseHeight = 1200; }
      else if (val === '4:5') { baseWidth = 1200; baseHeight = 1500; }
      else if (val === '16:9') { baseWidth = 1920; baseHeight = 1080; }

      canvas.width = baseWidth;
      canvas.height = baseHeight;
      resizeViewportCanvas();
      render();
    }

    window.addEventListener('resize', resizeViewportCanvas);

    function render() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      layers.forEach(layer => {
        ctx.save();
        const rx = (layer.x / 100) * canvas.width;
        const ry = (layer.y / 100) * canvas.height;
        const rw = (layer.w / 100) * canvas.width;
        const rh = (layer.h / 100) * canvas.height;

        ctx.beginPath();
        ctx.rect(rx, ry, rw, rh);
        ctx.clip();

        if (layer.type === 'solid') {
          ctx.fillStyle = layer.color1;
          ctx.fillRect(rx, ry, rw, rh);
        }
        else if (layer.type === 'gradient') {
          const rad = ((layer.angle || 0) * Math.PI) / 180;
          const cx = rx + rw / 2;
          const cy = ry + rh / 2;
          const length = Math.max(rw, rh);
          const x1 = cx - Math.cos(rad) * (length / 2);
          const y1 = cy - Math.sin(rad) * (length / 2);
          const x2 = cx + Math.cos(rad) * (length / 2);
          const y2 = cy + Math.sin(rad) * (length / 2);

          const grad = ctx.createLinearGradient(x1, y1, x2, y2);
          grad.addColorStop(0, layer.color1);
          grad.addColorStop(1, layer.color2);
          ctx.fillStyle = grad;
          ctx.fillRect(rx, ry, rw, rh);
        }
        else if (layer.type === 'stripes') {
          ctx.fillStyle = layer.color2;
          ctx.fillRect(rx, ry, rw, rh);

          ctx.strokeStyle = layer.color1;
          ctx.lineWidth = layer.thickness || 1.5;

          const step = Math.max(2, (layer.frequency || 5));
          const angle = layer.stripeAngle || 0;

          ctx.translate(rx + rw / 2, ry + rh / 2);
          ctx.rotate((angle * Math.PI) / 180);
          const diag = Math.sqrt(rw * rw + rh * rh);

          ctx.beginPath();
          for (let p = -diag / 2; p <= diag / 2; p += step) {
            ctx.moveTo(p, -diag / 2);
            ctx.lineTo(p, diag / 2);
          }
          ctx.stroke();
        }
        else if (layer.type === 'spikes') {
          ctx.fillStyle = layer.color1;
          ctx.fillRect(rx, ry, rw, rh);

          ctx.fillStyle = layer.color2;
          const count = Math.max(1, layer.frequency || 3);
          const dir = layer.spikeDirection || 'right';

          if (dir === 'right' || dir === 'left') {
            const toothH = rh / count;
            for (let i = 0; i < count; i++) {
              const yTop = ry + i * toothH;
              const yMid = yTop + toothH / 2;
              const yBot = yTop + toothH;

              ctx.beginPath();
              if (dir === 'right') {
                ctx.moveTo(rx, yTop);
                ctx.lineTo(rx + rw, yMid);
                ctx.lineTo(rx, yBot);
              } else {
                ctx.moveTo(rx + rw, yTop);
                ctx.lineTo(rx, yMid);
                ctx.lineTo(rx + rw, yBot);
              }
              ctx.closePath();
              ctx.fill();
            }
          } else {
            const toothW = rw / count;
            for (let i = 0; i < count; i++) {
              const xLeft = rx + i * toothW;
              const xMid = xLeft + toothW / 2;
              const xRight = xLeft + toothW;

              ctx.beginPath();
              if (dir === 'down') {
                ctx.moveTo(xLeft, ry);
                ctx.lineTo(xMid, ry + rh);
                ctx.lineTo(xRight, ry);
              } else {
                ctx.moveTo(xLeft, ry + rh);
                ctx.lineTo(xMid, ry);
                ctx.lineTo(xRight, ry + rh);
              }
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        ctx.restore();
      });

      const grainIntensity = parseInt(document.getElementById('grainAmount').value, 10);
      if (grainIntensity > 0) {
        applyProceduralGrain(grainIntensity);
      }

      ctx.restore();
    }

    function applyProceduralGrain(amount) {
      const w = canvas.width;
      const h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const len = data.length;
      const factor = amount * 1.8;

      for (let i = 0; i < len; i += 4) {
        const noise = (Math.random() - 0.5) * factor;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function renderLayerList() {
      const container = document.getElementById('layersList');
      container.innerHTML = '';

      layers.forEach((layer, index) => {
        const isActive = layer.id === activeLayerId;
        const card = document.createElement('div');
        card.className = `layer-card ${isActive ? 'active' : ''}`;

        card.innerHTML = `
          <div class="layer-header" onclick="selectLayer('${layer.id}')">
            <span class="layer-title">
              <span style="display:inline-block;width:12px;height:12px;background:${layer.color1};border-radius:2px;"></span>
              ${layer.type.toUpperCase()} #${index + 1}
            </span>
            <div class="layer-actions" onclick="event.stopPropagation()">
              <button class="small" onclick="moveLayer(${index}, -1)">▲</button>
              <button class="small" onclick="moveLayer(${index}, 1)">▼</button>
              <button class="small" onclick="deleteLayer('${layer.id}')">✕</button>
            </div>
          </div>
          ${isActive ? `
            <div class="layer-details">
              <div class="row">
                <label>Style</label>
                <select onchange="updateActiveLayer('type', this.value)">
                  <option value="solid" ${layer.type === 'solid' ? 'selected' : ''}>Solid Fill</option>
                  <option value="gradient" ${layer.type === 'gradient' ? 'selected' : ''}>Gradient Field</option>
                  <option value="stripes" ${layer.type === 'stripes' ? 'selected' : ''}>Pinstripes</option>
                  <option value="spikes" ${layer.type === 'spikes' ? 'selected' : ''}>Spikes / Teeth</option>
                </select>
              </div>

              <div class="grid-2">
                <div class="row">
                  <label>Color 1</label>
                  <input type="color" value="${layer.color1}" onchange="updateActiveLayer('color1', this.value)" />
                </div>
                ${layer.type !== 'solid' ? `
                <div class="row">
                  <label>Color 2</label>
                  <input type="color" value="${layer.color2 || '#000000'}" onchange="updateActiveLayer('color2', this.value)" />
                </div>
                ` : ''}
              </div>

              <div class="grid-2">
                <div class="row"><label>X %</label><input type="number" min="0" max="100" value="${layer.x}" onchange="updateActiveLayer('x', +this.value)" /></div>
                <div class="row"><label>Y %</label><input type="number" min="0" max="100" value="${layer.y}" onchange="updateActiveLayer('y', +this.value)" /></div>
              </div>
              <div class="grid-2">
                <div class="row"><label>W %</label><input type="number" min="1" max="100" value="${layer.w}" onchange="updateActiveLayer('w', +this.value)" /></div>
                <div class="row"><label>H %</label><input type="number" min="1" max="100" value="${layer.h}" onchange="updateActiveLayer('h', +this.value)" /></div>
              </div>

              ${layer.type === 'stripes' ? `
                <div class="row">
                  <label>Density</label>
                  <input type="range" min="2" max="25" step="1" value="${layer.frequency || 5}" oninput="updateActiveLayer('frequency', +this.value)" />
                </div>
                <div class="row">
                  <label>Angle</label>
                  <select onchange="updateActiveLayer('stripeAngle', +this.value)">
                    <option value="0" ${layer.stripeAngle === 0 ? 'selected' : ''}>Horizontal (0°)</option>
                    <option value="90" ${layer.stripeAngle === 90 ? 'selected' : ''}>Vertical (90°)</option>
                    <option value="45" ${layer.stripeAngle === 45 ? 'selected' : ''}>Diagonal (45°)</option>
                  </select>
                </div>
              ` : ''}

              ${layer.type === 'spikes' ? `
                <div class="row">
                  <label>Count</label>
                  <input type="range" min="1" max="12" step="1" value="${layer.frequency || 3}" oninput="updateActiveLayer('frequency', +this.value)" />
                </div>
                <div class="row">
                  <label>Direction</label>
                  <select onchange="updateActiveLayer('spikeDirection', this.value)">
                    <option value="right" ${layer.spikeDirection === 'right' ? 'selected' : ''}>Points Right</option>
                    <option value="left" ${layer.spikeDirection === 'left' ? 'selected' : ''}>Points Left</option>
                    <option value="down" ${layer.spikeDirection === 'down' ? 'selected' : ''}>Points Down</option>
                    <option value="up" ${layer.spikeDirection === 'up' ? 'selected' : ''}>Points Up</option>
                  </select>
                </div>
              ` : ''}

              ${layer.type === 'gradient' ? `
                <div class="row">
                  <label>Angle</label>
                  <input type="range" min="0" max="360" value="${layer.angle || 0}" oninput="updateActiveLayer('angle', +this.value)" />
                </div>
              ` : ''}
            </div>
          ` : ''}
        `;

        container.appendChild(card);
      });
    }

    function selectLayer(id) {
      activeLayerId = id;
      renderLayerList();
    }

    function updateActiveLayer(key, val) {
      const l = layers.find(item => item.id === activeLayerId);
      if (l) {
        l[key] = val;
        render();
        if (key === 'type') renderLayerList();
      }
    }

    function addNewLayer() {
      const pal = PALETTES[document.getElementById('paletteSelect').value];
      const newId = 'layer_' + Date.now();
      layers.push({
        id: newId,
        type: 'stripes',
        x: 10, y: 10, w: 80, h: 20,
        color1: pal[Math.floor(Math.random() * pal.length)],
        color2: pal[Math.floor(Math.random() * pal.length)],
        frequency: 6,
        thickness: 1.5,
        stripeAngle: 90
      });
      activeLayerId = newId;
      renderLayerList();
      render();
    }

    function deleteLayer(id) {
      if (layers.length <= 1) return;
      layers = layers.filter(l => l.id !== id);
      if (activeLayerId === id) activeLayerId = layers[0].id;
      renderLayerList();
      render();
    }

    function moveLayer(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= layers.length) return;
      const temp = layers[index];
      layers[index] = layers[target];
      layers[target] = temp;
      renderLayerList();
      render();
    }

    function applyPalette(paletteKey) {
      const p = PALETTES[paletteKey];
      layers.forEach((layer, i) => {
        layer.color1 = p[i % p.length];
        layer.color2 = p[(i + 2) % p.length];
      });
      renderLayerList();
      render();
    }

    function randomizeBySelectedArchetype() {
      const style = document.getElementById('randomStyleSelect').value;
      randomizeArtwork(style);
    }

    function getRandomColorPair(pal) {
      const c1 = pal[Math.floor(Math.random() * pal.length)];
      let c2 = pal[Math.floor(Math.random() * pal.length)];
      let tries = 0;
      while (c2 === c1 && tries < 10) {
        c2 = pal[Math.floor(Math.random() * pal.length)];
        tries++;
      }
      return [c1, c2];
    }

    // --- Generator Variations Engine ---
    function randomizeArtwork(archetype = 'balanced') {
      const paletteKeys = Object.keys(PALETTES);
      const chosenKey = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      document.getElementById('paletteSelect').value = chosenKey;
      const pal = PALETTES[chosenKey];

      const newLayers = [];

      // Solid background baseline
      newLayers.push({
        id: 'bg_' + Date.now(),
        type: 'solid',
        x: 0, y: 0, w: 100, h: 100,
        color1: pal[Math.floor(Math.random() * pal.length)]
      });

      if (archetype === 'gradients_only') {
        // Pure Atmospheric Gradients
        let curY = 0;
        let idx = 0;
        while (curY < 100) {
          const h = Math.min(100 - curY, Math.floor(Math.random() * 25) + 18);
          const [c1, c2] = getRandomColorPair(pal);
          const split = Math.random() > 0.45;

          if (split) {
            const splitX = Math.floor(Math.random() * 40) + 30;
            newLayers.push({
              id: `grad_${idx}_a`,
              type: 'gradient',
              x: 0, y: curY, w: splitX, h: h,
              color1: c1, color2: c2,
              angle: [0, 45, 90, 180, 270][Math.floor(Math.random() * 5)]
            });
            const [c3, c4] = getRandomColorPair(pal);
            newLayers.push({
              id: `grad_${idx}_b`,
              type: 'gradient',
              x: splitX, y: curY, w: 100 - splitX, h: h,
              color1: c3, color2: c4,
              angle: [90, 135, 180, 270][Math.floor(Math.random() * 4)]
            });
          } else {
            newLayers.push({
              id: `grad_${idx}`,
              type: 'gradient',
              x: 0, y: curY, w: 100, h: h,
              color1: c1, color2: c2,
              angle: [0, 90, 180, 270][Math.floor(Math.random() * 4)]
            });
          }
          curY += h;
          idx++;
        }
      }
      else if (archetype === 'wedges') {
        // Wedge Horizon / Saw Waves Focus
        let curY = 0;
        let idx = 0;
        while (curY < 100) {
          const h = Math.min(100 - curY, Math.floor(Math.random() * 20) + 12);
          const [c1, c2] = getRandomColorPair(pal);
          newLayers.push({
            id: `wedge_${idx}`,
            type: 'spikes',
            x: 0, y: curY, w: 100, h: h,
            color1: c1, color2: c2,
            frequency: Math.floor(Math.random() * 5) + 2,
            spikeDirection: ['right', 'left', 'up', 'down'][Math.floor(Math.random() * 4)]
          });
          curY += h;
          idx++;
        }
      }
      else if (archetype === 'interference') {
        // High density pinstripe moiré & interference
        const count = Math.floor(Math.random() * 3) + 5;
        let curY = 0;
        for (let i = 0; i < count; i++) {
          const h = Math.min(100 - curY, Math.floor(100 / count) + Math.floor(Math.random() * 6) - 3);
          const [c1, c2] = getRandomColorPair(pal);
          const split = Math.random() > 0.4;

          if (split) {
            const splitX = Math.floor(Math.random() * 40) + 30;
            newLayers.push({
              id: `inter_${i}_a`,
              type: 'stripes',
              x: 0, y: curY, w: splitX, h: h,
              color1: c1, color2: c2,
              frequency: Math.floor(Math.random() * 4) + 3,
              thickness: 1.5,
              stripeAngle: 90
            });
            const [c3, c4] = getRandomColorPair(pal);
            newLayers.push({
              id: `inter_${i}_b`,
              type: 'stripes',
              x: splitX, y: curY, w: 100 - splitX, h: h,
              color1: c3, color2: c4,
              frequency: Math.floor(Math.random() * 4) + 3,
              thickness: 1.5,
              stripeAngle: 0
            });
          } else {
            newLayers.push({
              id: `inter_${i}`,
              type: 'stripes',
              x: 0, y: curY, w: 100, h: h,
              color1: c1, color2: c2,
              frequency: Math.floor(Math.random() * 5) + 2,
              thickness: 1.5,
              stripeAngle: i % 2 === 0 ? 0 : 90
            });
          }
          curY += h;
          if (curY >= 100) break;
        }
      }
      else if (archetype === 'mondrian') {
        // Bauhaus / Mondrian Minimal Divisions
        const rows = [
          { y: 0, h: 32 },
          { y: 32, h: 42 },
          { y: 74, h: 26 }
        ];
        rows.forEach((r, idx) => {
          const splitX = Math.floor(Math.random() * 40) + 30;
          const [c1, c2] = getRandomColorPair(pal);
          newLayers.push({
            id: `mond_${idx}_a`,
            type: idx === 1 ? 'stripes' : 'solid',
            x: 0, y: r.y, w: splitX, h: r.h,
            color1: c1, color2: c2,
            frequency: 5,
            thickness: 1.8,
            stripeAngle: 90
          });
          const [c3, c4] = getRandomColorPair(pal);
          newLayers.push({
            id: `mond_${idx}_b`,
            type: idx === 0 ? 'gradient' : (idx === 2 ? 'spikes' : 'solid'),
            x: splitX, y: r.y, w: 100 - splitX, h: r.h,
            color1: c3, color2: c4,
            frequency: 3,
            spikeDirection: 'right',
            angle: 90
          });
        });
      }
      else if (archetype === 'dense') {
        // High density vertical/horizontal op-art grating rhythm
        const rows = Math.floor(Math.random() * 3) + 4;
        const rowH = 100 / rows;
        for (let r = 0; r < rows; r++) {
          const splits = Math.floor(Math.random() * 3) + 1;
          const colW = 100 / splits;
          for (let s = 0; s < splits; s++) {
            const [sc1, sc2] = getRandomColorPair(pal);
            newLayers.push({
              id: `grid_${r}_${s}`,
              type: Math.random() > 0.15 ? 'stripes' : 'spikes',
              x: Math.round(s * colW),
              y: Math.round(r * rowH),
              w: Math.round(colW),
              h: Math.round(rowH),
              color1: sc1,
              color2: sc2,
              frequency: Math.floor(Math.random() * 4) + 3,
              thickness: 1.5,
              stripeAngle: (r + s) % 2 === 0 ? 0 : 90,
              spikeDirection: ['right', 'left', 'up', 'down'][Math.floor(Math.random() * 4)]
            });
          }
        }
      } 
      else if (archetype === 'atmospheric') {
        // Soft gradient atmosphere with sharp spike chevrons
        let curY = 0;
        while (curY < 100) {
          const h = Math.min(100 - curY, Math.floor(Math.random() * 25) + 15);
          const [c1, c2] = getRandomColorPair(pal);
          const isSpike = Math.random() > 0.6;

          newLayers.push({
            id: `atm_${curY}`,
            type: isSpike ? 'spikes' : 'gradient',
            x: 0,
            y: curY,
            w: 100,
            h: h,
            color1: c1,
            color2: c2,
            frequency: Math.floor(Math.random() * 4) + 2,
            spikeDirection: Math.random() > 0.5 ? 'right' : 'left',
            angle: Math.floor(Math.random() * 4) * 90
          });
          curY += h;
        }
      }
      else if (archetype === 'chaos') {
        // Radical geometric free-partitioning
        const count = Math.floor(Math.random() * 5) + 7;
        for (let i = 0; i < count; i++) {
          const [c1, c2] = getRandomColorPair(pal);
          const types = ['stripes', 'spikes', 'gradient', 'solid'];
          newLayers.push({
            id: `chaos_${i}`,
            type: types[Math.floor(Math.random() * types.length)],
            x: Math.floor(Math.random() * 70),
            y: Math.floor(Math.random() * 75),
            w: Math.floor(Math.random() * 50) + 25,
            h: Math.floor(Math.random() * 40) + 15,
            color1: c1,
            color2: c2,
            frequency: Math.floor(Math.random() * 6) + 3,
            thickness: 1.6,
            stripeAngle: [0, 90, 45][Math.floor(Math.random() * 3)],
            spikeDirection: ['right', 'left', 'down', 'up'][Math.floor(Math.random() * 4)],
            angle: Math.floor(Math.random() * 360)
          });
        }
      }
      else {
        // Balanced classic constructivist
        let curY = 0;
        let index = 0;
        while (curY < 100) {
          const h = Math.min(100 - curY, Math.floor(Math.random() * 22) + 12);
          const [c1, c2] = getRandomColorPair(pal);
          const split = Math.random() > 0.45;

          if (split) {
            const splitX = Math.floor(Math.random() * 40) + 30;
            newLayers.push({
              id: `bal_${index}_a`,
              type: Math.random() > 0.3 ? 'stripes' : 'spikes',
              x: 0, y: curY, w: splitX, h: h,
              color1: c1, color2: c2,
              frequency: Math.floor(Math.random() * 5) + 3,
              thickness: 1.5,
              stripeAngle: Math.random() > 0.5 ? 90 : 0,
              spikeDirection: 'right'
            });

            const [c3, c4] = getRandomColorPair(pal);
            newLayers.push({
              id: `bal_${index}_b`,
              type: Math.random() > 0.4 ? 'gradient' : 'stripes',
              x: splitX, y: curY, w: 100 - splitX, h: h,
              color1: c3, color2: c4,
              frequency: Math.floor(Math.random() * 5) + 3,
              thickness: 1.5,
              stripeAngle: Math.random() > 0.5 ? 0 : 90,
              angle: 90
            });
          } else {
            const types = ['stripes', 'spikes', 'gradient'];
            newLayers.push({
              id: `bal_${index}`,
              type: types[Math.floor(Math.random() * types.length)],
              x: 0, y: curY, w: 100, h: h,
              color1: c1, color2: c2,
              frequency: Math.floor(Math.random() * 4) + 2,
              thickness: 1.5,
              stripeAngle: Math.random() > 0.5 ? 90 : 0,
              spikeDirection: Math.random() > 0.5 ? 'right' : 'left',
              angle: 90
            });
          }
          curY += h;
          index++;
        }
      }

      layers = newLayers;
      activeLayerId = layers[layers.length > 1 ? 1 : 0].id;
      renderLayerList();
      render();
    }

    function mutateColorsOnly() {
      const pal = PALETTES[document.getElementById('paletteSelect').value];
      layers.forEach(layer => {
        const [c1, c2] = getRandomColorPair(pal);
        layer.color1 = c1;
        if (layer.type !== 'solid') layer.color2 = c2;
      });
      renderLayerList();
      render();
    }

    function mutateGeometryOnly() {
      layers.forEach(layer => {
        if (layer.type === 'stripes') {
          layer.stripeAngle = layer.stripeAngle === 0 ? 90 : (layer.stripeAngle === 90 ? 45 : 0);
          layer.frequency = Math.floor(Math.random() * 6) + 3;
        } else if (layer.type === 'spikes') {
          layer.frequency = Math.floor(Math.random() * 5) + 2;
          layer.spikeDirection = ['right', 'left', 'down', 'up'][Math.floor(Math.random() * 4)];
        } else if (layer.type === 'gradient') {
          layer.angle = Math.floor(Math.random() * 8) * 45;
        }
      });
      renderLayerList();
      render();
    }

    function exportPNG() {
      render();
      const link = document.createElement('a');
      link.download = `rronblocks-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    initLayers();
    updateCanvasRatio();
    renderLayerList();
  </script>
</body>
</html>
